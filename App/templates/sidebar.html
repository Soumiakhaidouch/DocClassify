<style>

  :root {
    --orange: #e05e18;
    --orange-dark: #c5540e;
    --orange-dark: #e05e18;
    --orange-pale: #fff7ece2;
    --orange-mid: #eb8e6699;
    --bg: #f5f3ef4d;
    --card-bg: #FFFFFF;
    --text-dark: #111111f1;
    --text-muted: #444444;
    --border-light: #DEDAD4;
    --sidebar-width: 245px;
    --sidebar-bg: #FFFFFF;
    --sand-dark: #DEDAD4;
  }

  *,
  *::before,
  *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text-dark);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .app-container {
    display: flex;
    min-height: 100vh;
  }

  /* ===== SIDEBAR ===== */
  .sidebar {
    width: var(--sidebar-width);
    background: var(--sidebar-bg);
    border-right: 0.5px solid var(--border-light);
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 0;
    left: 0;
    height: 100vh;

    z-index: 1000;
    overflow-y: auto;
    overflow-x: hidden;
    margin: 2px
  }

  /* — Profile  — */
  .sidebar-profile {
    padding: 10px 12px 10px;
   
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
    text-decoration: none;
    transition: background 0.12s;
 
  }

  .sidebar-profile:hover {
    background: var(--bg);
  }

  .user-avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: #111111f0;
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 550;
    font-size: 13px;
    flex-shrink: 0;
  }

  .profile-info {
    min-width: 0;
    flex: 1;
  }

  .profile-name {
    font-weight: 550;
    font-size: 14px;
    color: var(--text-dark);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }


  /* — Logo — */
  .sidebar-logo {
    padding: 19px 12px 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    /* border-bottom: 0.5px solid var(--border-light); */
    flex-shrink: 0;
  }

  .logo-icon {
    width: 28px;
    height: 28px;
    background: var(--text-dark);
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    font-size: 0.9rem;
    flex-shrink: 0;
  }

  .logo-text {
    font-size: 17px;
    color: var(--text-dark);
    font-weight: 550;
    font-family: 'Poppins', serif;
    /* font-family: 'Playfair Display',sans-serif; */
    font-size: 20px;
    letter-spacing: 1px;
  }

  .logo-text span {
    font-size: 18px;
    font-weight: 500;
    text-transform: uppercase;
  }

  /* — Nav — */
  .sidebar-nav {
    flex: 1;
    padding: 22px 8px 6px;
    overflow-y: auto;
  }

  .nav-section {
    margin-bottom: 20px;
  }

  .nav-section-title {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #1d1f22cf;
    font-weight: 500;
    padding: 0 8px;
    /* margin-bottom: 4px; */

  }

  .sidebar-link {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 8px;
    border-radius: 7px;
    color: var(--text-dark);
    text-decoration: none;
    font-weight: 410;
    font-size: 12.5px;
    transition: background 0.12s, color 0.12s;
    margin-bottom: 4px;
    position: relative;
  }

  .sidebar-link .link-icon {
    width: 23px;
    height: 23px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
    color: #A8B4C8;
    color: var(--text-dark);
    flex-shrink: 0;
    transition: color 0.12s;
  }

  .sidebar-link:hover {
    background: #F0F2F6;
    background: var(--bg);
    color: var(--text-dark);
  }

  .sidebar-link:hover .link-icon {
    color: var(--text-muted);
  }

  .sidebar-link.active {
    background: var(--card-bg);
    color: var(--orange-dark);
    font-weight: 500;
    border: 0.8px solid var(--border-light);

  }

  .sidebar-link.active .link-icon {
    color: var(--orange);
  }

  .badge-count {
    background: var(--bg);
    color: var(--text-muted);
    border-radius: 20px;
    padding: 1px 7px;
    font-size: 10px;
    font-weight: 500;
    margin-left: auto;
    flex-shrink: 0;
    border: 0.5px solid var(--border-light);
  }

  .sidebar-link.active .badge-count {
    background: var(--orange-pale);
    color: var(--orange-dark);
    border-color: var(--orange);
  }

  /* — Footer — */
  .sidebar-footer {
    padding: 6px 8px 10px;
    border-top: 0.5px solid var(--border-light);
    flex-shrink: 0;
  }

  .sidebar-link.logout-link {
    color: #c21818;
  }

  .sidebar-link.logout-link .link-icon {
    color: #c42222;
  }

  .sidebar-link.logout-link:hover {
    background: #FEF0F0;
    color: #c11414;
  }

  .sidebar-link.logout-link:hover .link-icon {
    color: #c41d1d;
  }

  /* ===== MAIN CONTENT ===== */
  .main-content {
    margin-left: var(--sidebar-width);
    flex: 1;
    background: var(--bg);
    min-height: 100vh;
  }

  .top-bar {
    background: var(--card-bg);
    border-bottom: 1px solid var(--border-light);
    padding: 0 28px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .search-box {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg);
    border: 1px solid var(--sand-dark);
    border-radius: 7px;
    padding: 7px 14px;
    flex: 1;
    max-width: 340px;
    transition: border-color .15s;
  }

  .search-box:focus-within {
    border-color: var(--orange);
    box-shadow: 0 0 0 3px var(--orange-soft);
    background: #fff;
  }

  .search-box i {
    color: var(--text-muted);
    font-size: .8rem;
  }

  .search-box input {
    border: none;
    background: none;
    font-size: .855rem;
    color: var(--ink);
    outline: none;
    width: 100%;
  }

  .search-box input::placeholder {
    color: var(--text-muted);
  }


  .top-bar-right {
    display: flex;
    align-items: center;
    gap: 4px;
  }
</style>

<!-- sidebar.html -->
<aside class="sidebar">


  <!-- Logo -->
  <div class="sidebar-logo">
    <div class="logo-icon"><i class="fa-regular fa-file-lines"></i></div>

    <div class="logo-text">Doc<span>Classify</span></div>
  </div>

  <!-- Navigation -->
  <nav class="sidebar-nav">
    <div class="nav-section">
      <div class="nav-section-title">Principal</div>
      <a href="/" class="sidebar-link {% if request.endpoint == 'classify_document' %}active{% endif %}">
        <div class="link-icon"><i class="fas fa-house"></i></div>
        <span>Accueil</span>
      </a>

      <a href="/document_history" class="sidebar-link {% if request.endpoint == 'document_history' %}active{% endif %}">
        <div class="link-icon"><i class="fas fa-history"></i></div>
        <span>Historique</span>
        <span class="badge-count">{{ doc_count }}</span>
      </a>


      <a href="/browse_categories" class="sidebar-link {% if request.endpoint == 'browse_categories' %}active{% endif %}">
        <div class="link-icon"><i class="fas fa-folder-open"></i></div>
        <span>Documents</span>
      </a>

    </div>

    <div class="nav-section">
      <div class="nav-section-title">Bibliothèque</div>
      <a href="#" class="sidebar-link">
        <div class="link-icon"><i class="fas fa-star"></i></div>
        <span>Favoris</span>
        <span class="badge-count">0</span>
      </a>
      <a href="#" class="sidebar-link">
        <div class="link-icon"><i class="fas fa-trash-alt"></i></div>
        <span>Corbeille</span>
        <span class="badge-count">0</span>
      </a>
    </div>

    <div class="nav-section">
      <div class="nav-section-title">Support</div>
      <a href="#" class="sidebar-link">
        <div class="link-icon"><i class="fas fa-question-circle"></i></div>
        <span>Aide</span>
      </a>
    </div>
  </nav>

  <!-- Footer -->
  <!-- Profile (top) -->
  <a href="#" class="sidebar-profile" style="text-decoration:none;">
    <div class="user-avatar">
      {% if session.get('username') %}
      {{ session.username[0] | upper }}
      {% else %}
      <i class="fas fa-user" style="font-size:.9rem;"></i>
      {% endif %}
    </div>
    <div class="profile-info">
      <div class="profile-name">
        {% if session.get('username') %}{{ session.username }}{% else %}Invité{% endif %}
      </div>
      <div class="profile-role"> </div>
    </div>

  </a>

  <div class="sidebar-footer">
    <a href="/logout" class="sidebar-link logout-link">
      <div class="link-icon"><i class="fas fa-sign-out-alt"></i></div>
      <span>Déconnexion</span>
    </a>
  </div>

</aside>
